services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexicon
      POSTGRES_PASSWORD: lexicon
      POSTGRES_DB: lexicon
    ports:
      # Exposed for local tooling (psql, Prisma Studio). Remove in production.
      - "5432:5432"
    volumes:
      - lexicon-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexicon -d lexicon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lexicon:lexicon@db:5432/lexicon?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — openssl rand -base64 48}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      INTERPRETER_DAILY_MINUTES: ${INTERPRETER_DAILY_MINUTES:-30}
      INTERPRETER_MAX_SESSION_MINUTES: ${INTERPRETER_MAX_SESSION_MINUTES:-15}
      INTERPRETER_COST_ASR_PER_MIN: ${INTERPRETER_COST_ASR_PER_MIN:-0}
      INTERPRETER_COST_MT_INPUT_PER_MTOK: ${INTERPRETER_COST_MT_INPUT_PER_MTOK:-0}
      INTERPRETER_COST_MT_OUTPUT_PER_MTOK: ${INTERPRETER_COST_MT_OUTPUT_PER_MTOK:-0}
      INTERPRETER_COST_MT_CACHE_READ_PER_MTOK: ${INTERPRETER_COST_MT_CACHE_READ_PER_MTOK:-0}
      INTERPRETER_COST_MT_CACHE_WRITE_PER_MTOK: ${INTERPRETER_COST_MT_CACHE_WRITE_PER_MTOK:-0}
      INTERPRETER_COST_TTS_PER_1K_CHARS: ${INTERPRETER_COST_TTS_PER_1K_CHARS:-0}
      NODE_ENV: production
    ports:
      - "3000:3000"

  # Live interpreter (optional): `docker compose --profile interpreter up -d`.
  # Dev-mode LiveKit uses the well-known devkey/secret pair; never expose it.
  livekit:
    profiles: [interpreter]
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"     # signalling (ws)
      - "7881:7881"     # media over TCP fallback
      - "7882:7882/udp" # media over UDP

  interpreter-agent:
    profiles: [interpreter]
    build: ./agents/interpreter
    restart: unless-stopped
    depends_on: [livekit]
    # Shares LiveKit's network namespace: the dev server advertises 127.0.0.1
    # as its media address, which is only reachable from inside it.
    network_mode: "service:livekit"
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      # Live captions. Without a key the session still runs; captions show
      # as unavailable.
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      # Live translation (needs captions too).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INTERPRETER_MT_MODEL: ${INTERPRETER_MT_MODEL:-claude-haiku-5-5}
      INTERPRETER_MT_FALLBACK_MODEL: ${INTERPRETER_MT_FALLBACK_MODEL:-}
      # Spoken translation (needs translation too).
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      CARTESIA_VOICE_ID: ${CARTESIA_VOICE_ID:-}
      # End-of-session usage and latency reports go to the app.
      INTERPRETER_REPORT_URL: http://app:3000/api/interpreter/report
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

volumes:
  lexicon-db:
